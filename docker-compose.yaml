services:
  db:
    image: mariadb:11.8
    container_name: mariadb
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - celc_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: celc-api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
  
  web:
    image: rhuanlino/celc-web:latest
    container_name: celc-web
    restart: unless-stopped
    ports:
      - "80:3000"
    depends_on:
      - api
    networks:
      - backend

volumes:
  celc_data:

networks:
  backend: